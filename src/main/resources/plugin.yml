name: Trade
version: ${project.version}
main: com.metox.trade.TradePlugin
api-version: 1.13
author: chizzar-dev
website: https://discord.gg/forges
description: Guvenli oyuncular arasi takas (dupe ve scam korumali).

commands:
  trade:
    description: Bir oyuncuyla guvenli takas
    usage: /trade <oyuncu> | /trade kabul | /trade ret | /trade iptal
    aliases: [takas]

permissions:
  trade.use:
    description: Takas yapabilir
    default: true
