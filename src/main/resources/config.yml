# Trade - chizzar-dev
# https://github.com/chizzar-dev/Trade

# Takas istegi kac saniye sonra zaman asimina ugrar
request-timeout: 60

# Takas icin gereken en fazla uzaklik (blok, 0 = sinirsiz)
max-distance: 0

# Iki taraf da onayladiktan sonra beklenecek sure (tick).
# Bu sirada teklif degistirilemez; son an degistirme scam'ini onler.
# 20 tick = 1 saniye. 0 yaparsan aninda tamamlanir.
confirm-delay-ticks: 20

# Takasa konulamayacak esyalar (materyal adi)
blacklist: []

# Tamamlanan takaslar konsola yazilsin mi
log-trades: true

gui:
  title: "&8Takas &7- &f%player%"
  filler: "GRAY_STAINED_GLASS_PANE"

